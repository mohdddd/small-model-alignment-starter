[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-alignment-starter"
version = "0.2.0"
description = "From-scratch SFT + DPO on Qwen2.5-0.5B, TRL LoRA-DPO persona tuning, and pairwise LLM-judge evaluation."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
